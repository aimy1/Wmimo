name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test (Flutter & Dart)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Translations
        run: dart run slang

      - name: Run Static Analysis
        run: flutter analyze lib test third_party/libclash_vpn_service

      - name: Run Automated Test Suite
        run: flutter test
