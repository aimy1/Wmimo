name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.30)'
        required: false
        default: 'v1.0.30'

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    name: Build Windows Release (x64 & arm64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Translations
        run: dart run slang

      - name: Download Multiplatform Mihomo Cores
        run: dart run tool/download_all_cores.dart

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Artifacts (Installer & Portable)
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag -or $tag -eq "") {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -eq "main" -or -not $tag -or $tag -eq "") {
            $tag = "v1.0.30"
          }

          $releasePath = (Resolve-Path "build/windows/x64/runner/Release").Path
          $distDir = New-Item -ItemType Directory -Force -Path "dist"
          $distPath = $distDir.FullName

          # Ensure core and wintun.dll are present in Release
          $corePath = "bind/windows/core/wmimoService.exe"
          if (Test-Path $corePath) {
            Copy-Item -Path $corePath -Destination "$releasePath/wmimoService.exe" -Force
          }
          $wintunPath = "bind/windows/core/wintun.dll"
          if (Test-Path $wintunPath) {
            Copy-Item -Path $wintunPath -Destination "$releasePath/wintun.dll" -Force
          }

          # Locate or Install Inno Setup
          $iscc = "ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") {
              $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            } else {
              choco install innosetup --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }

          # 1. Package Windows x64 (Installer & Portable)
          Write-Host "Compiling Inno Setup Installer for x64..." -ForegroundColor Cyan
          & $iscc "/DMyAppVersion=$tag" "/DMyAppArch=x64" "/DSourceDir=$releasePath" "/DOutputDir=$distPath" packaging/windows/setup.iss
          $zipNameX64 = "Wmimo-Windows-x64-$tag.zip"
          Compress-Archive -Path "$releasePath/*" -DestinationPath "$distPath/$zipNameX64" -Force

          # 2. Package Windows ARM64 (Installer & Portable)
          $arm64ReleasePath = "build/windows/arm64/Release"
          New-Item -ItemType Directory -Force -Path $arm64ReleasePath | Out-Null
          Copy-Item -Path "$releasePath/*" -Destination $arm64ReleasePath -Recurse -Force
          $arm64CorePath = "bind/windows/core_arm64/wmimoService.exe"
          if (Test-Path $arm64CorePath) {
            Copy-Item -Path $arm64CorePath -Destination "$arm64ReleasePath/wmimoService.exe" -Force
          }
          $arm64WintunPath = "bind/windows/core_arm64/wintun.dll"
          if (Test-Path $arm64WintunPath) {
            Copy-Item -Path $arm64WintunPath -Destination "$arm64ReleasePath/wintun.dll" -Force
          }
          $arm64Resolved = (Resolve-Path $arm64ReleasePath).Path
          Write-Host "Compiling Inno Setup Installer for ARM64..." -ForegroundColor Cyan
          & $iscc "/DMyAppVersion=$tag" "/DMyAppArch=arm64" "/DSourceDir=$arm64Resolved" "/DOutputDir=$distPath" packaging/windows/setup.iss
          $zipNameArm64 = "Wmimo-Windows-arm64-$tag.zip"
          Compress-Archive -Path "$arm64Resolved/*" -DestinationPath "$distPath/$zipNameArm64" -Force

          Write-Host "Created Windows artifacts in dist/:" -ForegroundColor Green
          Get-ChildItem -Path $distPath | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*

  build-android:
    name: Build Android Release (Split ABIs & Universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Translations
        run: dart run slang

      - name: Download Multiplatform Mihomo Cores
        run: dart run tool/download_all_cores.dart

      - name: Build Android APK
        run: flutter build apk --release

      - name: Package Android Artifacts
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="v1.0.30"
          fi
          
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Wmimo-Android-arm64-v8a-$TAG.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Wmimo-Android-armeabi-v7a-$TAG.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Wmimo-Android-x86_64-$TAG.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/Wmimo-Android-universal-$TAG.apk
          fi
          ls -la dist/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Determine Release Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v1.0.30"
            fi
          fi
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: "Wmimo ${{ steps.tag_info.outputs.release_tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
