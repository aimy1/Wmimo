name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.30)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Translations
        run: dart run slang

      - name: Download Multiplatform Mihomo Cores
        run: dart run tool/download_all_cores.dart

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Artifacts (Installer & Portable)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or -not $tag) {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          if (-not $tag -or $tag -eq "") {
            $tag = "v1.0.30"
          }

          $releasePath = (Resolve-Path "build/windows/x64/runner/Release").Path
          $distDir = New-Item -ItemType Directory -Force -Path "dist"
          $distPath = $distDir.FullName

          # Ensure core is present in Release
          $corePath = "bind/windows/core/wmimoService.exe"
          if (Test-Path $corePath) {
            Copy-Item -Path $corePath -Destination "$releasePath/wmimoService.exe" -Force
          }

          # 1. Locate/Install Inno Setup and build Setup Installer
          $iscc = "ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") {
              $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            } else {
              choco install innosetup --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }

          Write-Host "Compiling Inno Setup Installer using $iscc..." -ForegroundColor Cyan
          & $iscc "/DMyAppVersion=$tag" "/DMyAppArch=x64" "/DSourceDir=$releasePath" "/DOutputDir=$distPath" packaging/windows/setup.iss

          # 2. Package Portable Zip
          $zipName = "Wmimo-Windows-x64-$tag.zip"
          Compress-Archive -Path "$releasePath/*" -DestinationPath "$distPath/$zipName" -Force
          Write-Host "Created Windows artifacts in dist/:" -ForegroundColor Green
          Get-ChildItem -Path $distPath | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Translations
        run: dart run slang

      - name: Download Multiplatform Mihomo Cores
        run: dart run tool/download_all_cores.dart

      - name: Build Android APK
        run: flutter build apk --release

      - name: Package Android Artifacts
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.30"
          fi
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/Wmimo-Android-$TAG.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Wmimo-Android-armv7-$TAG.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Wmimo-Android-arm64-$TAG.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Wmimo-Android-x86_64-$TAG.apk
          fi
          ls -la dist/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Files
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
